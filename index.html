<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a0f"><title>StoryForge</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080a0f;color:#f5f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:760px;margin:auto;padding:20px 16px 50px}.brand{font-size:28px;font-weight:900}.sub{color:#8e99aa;margin:4px 0 20px}.card{background:#11151d;border:1px solid #252c38;border-radius:18px;padding:16px;margin:12px 0}h2{font-size:16px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{width:100%;padding:13px;border:1px solid #29313e;background:#151a23;color:#fff;border-radius:12px;font-weight:750}button.active{border-color:#7c5cff;background:#281f5b}.start{margin-top:12px;background:#7c5cff;border:0;font-size:16px}.hidden{display:none}.muted{color:#8e99aa;font-size:13px}.row{display:flex;justify-content:space-between;gap:12px}.bar{height:10px;background:#202632;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#7c5cff;transition:width .35s}.status{background:#0b0f15;border-radius:11px;padding:12px;margin-top:12px;font-size:13px}.steps{display:grid;gap:8px;margin-top:12px}.step{padding:10px;border:1px solid #252c38;border-radius:10px;color:#8994a4}.step.on{border-color:#5b46c5;background:#17132a;color:#fff}.step.ok{color:#4de29b;border-color:#28714d}.error{color:#ff7b89}.video{width:100%;border-radius:14px;background:#000}.download{display:block;text-align:center;background:#fff;color:#000;padding:14px;border-radius:12px;margin-top:10px;text-decoration:none;font-weight:850}
</style></head><body><main>
<div class="brand">StoryForge</div><div class="sub">Autonomer Roblox Video Agent</div>
<div class="card"><h2>Format</h2><div class="grid"><button id="short" class="active">📱 Short</button><button id="long">🎬 Longform</button></div><div id="durationBox" class="hidden" style="margin-top:12px"><div class="row"><span class="muted">Videolänge</span><b><span id="duration">5</span> Min.</b></div><input id="slider" type="range" min="3" max="10" value="5" style="width:100%" oninput="duration.textContent=this.value"></div></div>
<div class="card"><h2>Nische</h2><div id="niches" class="grid"></div></div>
<div class="card"><h2>Optionales Thema</h2><textarea id="topic" placeholder="Leer lassen = Agent entscheidet selbst" style="width:100%;min-height:82px;background:#0b0f15;border:1px solid #29313e;border-radius:12px;padding:12px;color:#fff"></textarea><button class="start" id="start">🚀 VIDEO ERSTELLEN</button><div class="muted" style="margin-top:8px">Der Gemini-Key bleibt serverseitig. Für den Test muss der Betreiber ihn als GEMINI_API_KEY setzen.</div></div>
<div id="progress" class="card hidden"><h2>🚀 Agent arbeitet</h2><div class="row"><b id="percent">0 %</b><span id="eta" class="muted">wird berechnet …</span></div><div class="bar"><div id="fill" class="fill"></div></div><div id="message" class="status">Job wird gestartet …</div><div id="steps" class="steps"></div></div>
<div id="result" class="card hidden"><h2>🎬 Dein Video ist fertig</h2><video id="video" class="video" controls playsinline></video><a id="download" class="download">⬇️ VIDEO DOWNLOADEN</a><div id="details" class="muted" style="margin-top:12px"></div></div>
</main><script>
const list=["😂 Roblox Memes","🗣️ Roblox Rants","📖 Roblox Storytime","💀 Roblox Brainrot","😱 Roblox Horror","💬 Roblox Chat Stories","🕵️ Roblox Mystery","📰 Roblox News & Drama","🎮 Roblox Commentary","🔥 AI findet aktuellen Trend"];
let format="Short",niche="Roblox Memes",timer;
list.forEach((x,i)=>{const b=document.createElement("button");b.textContent=x;b.className=i?"":"active";b.onclick=()=>{niche=x.replace(/^\\S+\\s/,"");document.querySelectorAll("#niches button").forEach(z=>z.classList.remove("active"));b.classList.add("active")};niches.appendChild(b)});
short.onclick=()=>{format="Short";short.classList.add("active");long.classList.remove("active");durationBox.classList.add("hidden")};
long.onclick=()=>{format="Longform";long.classList.add("active");short.classList.remove("active");durationBox.classList.remove("hidden")};
const names=["🧠 Thema & Story","🪝 Hook & Skript","🎨 Bilder","🎙️ Voiceover","💬 Untertitel","🎥 Animation","✂️ Videoschnitt","🔍 Qualitätskontrolle","✅ Fertig"];
function setup(){steps.innerHTML=names.map((n,i)=>`<div class="step" id="step${i}">${n}<span id="count${i}" style="float:right"></span></div>`).join("")}
function show(d){const p=d.percent||0;percent.textContent=p+" %";fill.style.width=p+"%";eta.textContent=d.eta||"wird berechnet …";message.textContent=d.message||"Agent arbeitet …";if(Number.isInteger(d.step)){for(let i=0;i<d.step;i++)document.getElementById("step"+i)?.classList.add("ok");document.getElementById("step"+d.step)?.classList.add("on");if(d.count)document.getElementById("count"+d.step).textContent=d.count}}
async function poll(id){try{const r=await fetch("/api/jobs/"+id,{cache:"no-store"});const d=await r.json();if(!r.ok)throw Error(d.error||"Status konnte nicht geladen werden");show(d);if(d.status==="done"){for(let i=0;i<9;i++)document.getElementById("step"+i)?.classList.add("ok");video.src=d.videoUrl;download.href=d.videoUrl;download.download="storyforge-video.mp4";details.textContent=d.title||"";result.classList.remove("hidden");localStorage.removeItem("sfJob");return}if(d.status==="error"){message.innerHTML='<span class="error">❌ '+(d.error||"Produktion fehlgeschlagen")+"</span>";return}timer=setTimeout(()=>poll(id),1200)}catch(e){message.textContent="Verbindung kurz unterbrochen. Der Agent arbeitet weiter …";timer=setTimeout(()=>poll(id),2500)}}
start.onclick=async()=>{clearTimeout(timer);progress.classList.remove("hidden");result.classList.add("hidden");setup();show({percent:0,step:0,message:"Job wird gestartet …"});try{const r=await fetch("/api/jobs",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({format,niche,topic:topic.value.trim(),duration:format==="Longform"?Number(slider.value):null})});const d=await r.json();if(!r.ok)throw Error(d.error||"Job konnte nicht gestartet werden");localStorage.setItem("sfJob",d.jobId);poll(d.jobId)}catch(e){message.innerHTML='<span class="error">❌ '+e.message+"</span>"}};
setup();const old=localStorage.getItem("sfJob");if(old){progress.classList.remove("hidden");poll(old)}
</script></body></html>
